<!doctype html>
<html lang="en" class="js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RILL 01 — Stainless pet fountain | RILL</title>
<meta name="description" content="RILL 01: 2.8 L, 316 stainless, 24 dB, five parts, thirty-second teardown. The pet fountain designed to be kept.">
<meta name="theme-color" content="#08090b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2308090b'/%3E%3Ctext x='16' y='22' font-family='Helvetica' font-size='13' fill='%23edebe5' text-anchor='middle' letter-spacing='2'%3ER%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<header class="header is-solid" id="header">
  <a class="brand" href="index.html">RILL<em>®</em></a>
  <nav class="nav" aria-label="Primary">
    <a href="index.html#collection" data-i18n="nav.shop">Shop</a>
    <a href="index.html#engineering" data-i18n="nav.technology">Technology</a>
    <a href="index.html#ritual" data-i18n="nav.ritual">Ritual</a>
    <a href="index.html#faq" data-i18n="nav.faq">FAQ</a>
  </nav>
  <div class="spacer"></div>
  <div class="tools">
    <button class="icon-btn" id="langBtn" aria-label="Switch language"><span id="langLabel">中</span></button>
    <button class="icon-btn" id="cartBtn" aria-label="Open bag">
      <span id="cartLabel">Bag</span><span class="cart-count" id="cartCount">0</span>
    </button>
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu">☰</button>
  </div>
</header>

<main class="pdp">
  <div class="wrap">
    <div class="pdp__grid">
      <div>
        <div class="pdp__gallery">
          <img id="pdpImg" src="assets/fountain-steel.svg" alt="RILL 01" width="620" height="760">
        </div>
        <div class="pdp__thumbs" id="pdpThumbs"></div>
      </div>

      <div class="pdp__info">
        <div class="crumb" id="crumb"></div>
        <p class="eyebrow" id="pdpEyebrow" style="margin-bottom:14px"></p>
        <h1 class="pdp__title" id="pdpTitle">RILL 01</h1>
        <p class="pdp__sub" id="pdpSub"></p>
        <div class="pdp__price-row">
          <span class="pdp__price num" id="pdpPrice">$129</span>
          <span class="pdp__rating" id="pdpRating"></span>
        </div>
        <p class="pdp__desc" id="pdpDesc"></p>

        <div class="opt">
          <div class="opt__label"><span id="variantLabel">Finish</span><span id="variantName"></span></div>
          <div class="swatches" id="swatches"></div>
        </div>

        <div class="pdp__buy">
          <div class="qty">
            <button id="qMinus" aria-label="Decrease">−</button>
            <span id="qVal">1</span>
            <button id="qPlus" aria-label="Increase">+</button>
          </div>
          <button class="btn pdp__cta" id="addBtn"><span id="addLabel">Add to bag</span></button>
        </div>
        <div class="pdp__meta">
          <span id="pdpStock"></span>
          <span id="pdpShip"></span>
          <span id="pdpCtaNote"></span>
        </div>

        <div class="feature-grid" id="features"></div>

        <div class="pdp__acc" id="acc"></div>
      </div>
    </div>
  </div>

  <section class="pad-y--sm" style="margin-top:clamp(48px,6vw,96px);border-top:1px solid var(--line)">
    <div class="wrap">
      <div class="col-head">
        <div>
          <p class="eyebrow" data-i18n="pdp.relatedLabel">Also in the collection</p>
          <h2 class="h2" data-i18n="pdp.relatedTitle">Kept, together</h2>
        </div>
      </div>
      <div class="cards" id="related"></div>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="wrap">
    <div class="footer__top">
      <div class="footer__brand">
        <div class="brand">RILL<em>®</em></div>
        <p data-i18n="footer.tagline"></p>
        <a class="link-u" href="index.html#collection" data-i18n="nav.shop">Shop</a>
      </div>
      <div id="footCols" style="display:contents"></div>
    </div>
    <div class="footer__bottom">
      <span data-i18n="footer.legal"></span>
      <span class="grow"></span>
      <div class="footer__badges" id="badges"></div>
      <span data-i18n="footer.disclaimer"></span>
    </div>
  </div>
</footer>

<div class="buybar" id="buybar">
  <div class="p"><small id="bbName">RILL 01</small><span class="num" id="bbPrice">$129</span></div>
  <button class="btn" id="bbAdd"><span data-i18n="pdp.cta">Add to bag</span></button>
</div>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer" aria-label="Shopping bag" aria-hidden="true">
  <div class="drawer__head">
    <h3 data-i18n="cart.title">Bag</h3>
    <button class="icon-btn" id="closeCart" aria-label="Close">✕</button>
  </div>
  <div class="drawer__body" id="cartBody"></div>
  <div class="drawer__foot" id="cartFoot"></div>
</aside>
<div class="toast" id="toast"></div>

<script src="assets/copy.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
